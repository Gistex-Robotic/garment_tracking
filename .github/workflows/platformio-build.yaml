name: PlatformIO Build RFID Cutting

on:
  push:
    branches:
      - develop
      - prod
  pull_request:
    branches:
      - prod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build RFID Cutting
        working-directory: platformio/RFID_Cutting
        run: pio run